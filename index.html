<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Город Эндонет — Карта Мира и Динамичный Рейд</title>
    <style>
        body { margin: 0; overflow: hidden; background: #11141a; font-family: 'Segoe UI', sans-serif; user-select: none; }
        #gameCanvas { display: block; cursor: crosshair; }
        
        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 320px;
            z-index: 10;
        }

        .panel {
            background: rgba(20, 25, 38, 0.88);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 12px 16px;
            color: #fff;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }

        .world-level-badge {
            font-size: 15px;
            font-weight: 700;
            color: #e67e22;
            text-transform: uppercase;
        }

        .raid-timer-box {
            margin-top: 6px;
            padding: 6px 10px;
            background: rgba(231, 76, 60, 0.2);
            border: 1px solid #e74c3c;
            border-radius: 6px;
            font-weight: bold;
            font-size: 13px;
            color: #e74c3c;
            text-align: center;
        }

        .resources-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 6px;
        }

        .res-item {
            background: rgba(255, 255, 255, 0.08);
            padding: 6px 10px;
            border-radius: 6px;
            font-weight: 600;
        }

        .btn-ui {
            background: #2980b9;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
            text-align: center;
            font-size: 14px;
        }
        .btn-ui:hover { background: #3498db; }

        .quest-list {
            margin-top: 6px;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .quest-item {
            background: rgba(255,255,255,0.05);
            padding: 8px;
            border-radius: 6px;
            border-left: 3px solid #f39c12;
        }
        .quest-item.completed { border-left-color: #2ecc71; }
        .quest-npc-author { font-size: 11px; color: #f1c40f; font-weight: bold; margin-bottom: 2px; }

        /* СЦЕНА ДОМАШНЕЙ БАЗЫ */
        #home-base-screen {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle, #2c3e50 0%, #0f171e 100%);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 500;
            color: white;
        }

        .pedestal-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .hero-avatar {
            font-size: 80px;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5));
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
        }

        .pedestal {
            width: 220px;
            height: 45px;
            background: linear-gradient(180deg, #d35400, #7f8c8d);
            border-radius: 50%;
            box-shadow: 0 15px 30px rgba(0,0,0,0.8), inset 0 2px 5px rgba(255,255,255,0.4);
            margin-top: -20px;
            margin-bottom: 25px;
            border: 3px solid #f39c12;
        }

        .hero-info-card {
            background: rgba(20, 25, 38, 0.9);
            border: 1px solid #f1c40f;
            border-radius: 12px;
            padding: 20px;
            width: 320px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 15px 0;
            font-size: 13px;
        }
        .stat-box { background: rgba(255,255,255,0.05); padding: 8px; border-radius: 6px; }

        .base-actions { display: flex; gap: 15px; }
        .btn-upgrade { background: #2ecc71; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-upgrade:disabled { background: #7f8c8d; cursor: not-allowed; opacity: 0.6; }
        .btn-upgrade:hover:not(:disabled) { background: #27ae60; }
        .btn-change { background: #e67e22; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-change:hover { background: #d35400; }
        .btn-back { position: absolute; top: 30px; left: 30px; background: #e74c3c; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }

        /* ОКНО СПИСКА ГЕРОЕВ */
        #hero-select-modal {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 23, 30, 0.98);
            border: 2px solid #f1c40f;
            border-radius: 16px;
            padding: 20px;
            width: 80%;
            max-width: 850px;
            display: none;
            z-index: 600;
            box-shadow: 0 20px 60px rgba(0,0,0,0.9);
        }

        .heroes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .hero-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            transition: 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .hero-card.active { border-color: #2ecc71; background: rgba(46, 204, 113, 0.1); }
        .hero-card:hover { transform: translateY(-5px); }

        .hero-card-cost {
            background: rgba(0,0,0,0.3);
            border-radius: 6px;
            padding: 4px;
            font-size: 11px;
            margin: 6px 0;
            color: #f39c12;
        }

        /* МИНИ-КАРТА И ДИАЛОГИ */
        #minimap-container {
            position: absolute; top: 20px; right: 20px;
            width: 160px; height: 160px; border-radius: 50%;
            border: 3px solid rgba(241, 196, 15, 0.8); overflow: hidden;
            background: #1e272e; pointer-events: none;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
        }
        #minimap { width: 100%; height: 100%; }

        #npc-dialog {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(20, 25, 38, 0.95);
            border: 2px solid #f1c40f; border-radius: 16px;
            padding: 20px 25px; color: white; width: 320px;
            display: none; z-index: 100;
        }
    </style>
</head>
<body>
    <div id="ui-container">
        <div class="panel">
            <div class="world-level-badge">🏰 Замок | Уровень: <span id="worldLevel">1</span></div>
            <div class="raid-timer-box">⚔️ Рейд врагов через: <span id="raidTimer">45</span>с</div>
            <div class="resources-grid">
                <div class="res-item">🪙 <span id="coins">0</span></div>
                <div class="res-item">🪵 <span id="wood">0</span></div>
                <div class="res-item">🪨 <span id="stone">0</span></div>
            </div>
        </div>

        <button class="btn-ui" onclick="openHomeBase()">🏠 Домашняя база</button>

        <div class="panel">
            <div style="font-weight: bold; font-size: 13px;">📋 Активные Задания:</div>
            <div id="quest-list" class="quest-list"></div>
        </div>
    </div>

    <!-- СЦЕНА ДОМАШНЕЙ БАЗЫ -->
    <div id="home-base-screen">
        <button class="btn-back" onclick="closeHomeBase()">← Назад в игру</button>
        
        <h2>🏠 Домашняя База Героев</h2>

        <div class="pedestal-container">
            <div class="hero-avatar" id="base-hero-icon">⚔️</div>
            <div class="pedestal"></div>
        </div>

        <div class="hero-info-card">
            <h3 id="base-hero-name" style="margin:0; color:#f1c40f;">Воин Вальгар</h3>
            <div id="base-hero-class" style="color:#bdc3c7; font-size:13px; margin-bottom:5px;">Класс: Воин</div>
            <div style="font-size:14px;">Уровень: <b id="base-hero-lvl" style="color:#2ecc71;">1</b></div>
            
            <div class="stats-grid">
                <div class="stat-box">❤️ Здоровье<br><b id="base-hero-hp">100</b></div>
                <div class="stat-box">⚔️ Сила<br><b id="base-hero-atk">15</b></div>
                <div class="stat-box">🛡️ Защита<br><b id="base-hero-def">10</b></div>
            </div>
        </div>

        <div class="base-actions">
            <button id="btn-upgrade-hero" class="btn-upgrade" onclick="upgradeCurrentHero()">
                Улучшить<br>
                <small id="upgrade-cost-text">🪙 30 | 🪵 15 | 🪨 15</small>
            </button>
            <button class="btn-change" onclick="openHeroSelectModal()">Сменить героя</button>
        </div>
    </div>

    <!-- ОКНО ВЫБОРА ГЕРОЕВ -->
    <div id="hero-select-modal">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3 style="margin:0; color:#f1c40f;">Выберите героя для боя</h3>
            <button onclick="closeHeroSelectModal()" style="background:none; border:none; color:white; font-size:20px; cursor:pointer;">✖</button>
        </div>
        <div id="heroes-list-container" class="heroes-grid"></div>
    </div>

    <div id="minimap-container"><canvas id="minimap" width="160" height="160"></canvas></div>

    <div id="npc-dialog">
        <h3 id="dialog-title">🧙‍♂️ Имя NPC</h3>
        <p id="dialog-text">Загрузка...</p>
        <div style="background: rgba(241,196,15,0.15); padding:8px; border-radius:6px; margin:12px 0; font-size:13px;">
            Награда: <span id="dialog-reward-text">...</span>
        </div>
        <div style="display:flex; gap:10px;">
            <button class="btn-ui" style="background:#2ecc71;" onclick="acceptQuest()">Принять</button>
            <button class="btn-ui" style="background:#e74c3c;" onclick="skipQuest()">Пропустить</button>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>
    <script src="game.js"></script>
</body>
</html>
